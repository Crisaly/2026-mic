<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Mic</title>
<style>
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .view { display: none; flex-direction: column; gap: 20px; width: 320px; }
  .active { display: flex; }
  button { padding: 18px; font-size: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
  .sing { background: #ff453a; }
  .listen { background: #0a84ff; }
  .test { background: #5856d6; }
  .unmute { background: #30d158; }
  input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #1c1c1e; color: #fff; text-align: center; }
  .panel { background: #1c1c1e; padding: 15px; border-radius: 12px; text-align: left; margin-top: 10px; }
  #meter, #statusLog { font-weight: bold; color: #ff9f0a; min-height: 24px; font-size: 14px; }
  audio { width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<div id="picker" class="view active">
  <h1>🎤 Karaoke Mic</h1>
  <button class="sing" onclick="setRole('sing')">I'm Singing</button>
  <button class="listen" onclick="setRole('listen')">I'm the Speaker</button>
</div>

<div id="sender" class="view">
  <h2>Wireless Mic</h2>
  <input type="text" id="name" placeholder="Your Name">
  <button class="sing" id="micBtn" onclick="toggleMic()">Start Singing</button>
  <button class="test" id="testBtn" onclick="playPhoneTestTone()" style="display:none;">🔊 Play Test Tone</button>
  <div id="meter">Mic Status: Ready</div>
  <button onclick="location.reload()" style="background:#444">Back</button>
</div>

<div id="receiver" class="view" style="width: 400px;">
  <h2>Speaker Hub</h2>
  <button class="unmute" onclick="forceAudioContext()">🔊 1. Click Here to Enable Audio</button>
  <div id="statusLog">Connection: Waiting for handshake...</div>
  <div class="panel">
    <h3>Connected Singers</h3>
    <div id="list">None connected</div>
    <div id="audio-container"></div>
  </div>
  <button onclick="location.reload()" style="background:#444">Back</button>
</div>

<script>
let role = '', pc, stream, ws;
let globalAudioCtx = null, phoneAudioCtx = null;
const rtcConfig = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };

function connectSignaling() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}`);
  
  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    
    if (role === 'listen') {
      if (msg.type === 'offer') {
        await handleOffer(msg);
      } else if (msg.type === 'candidate' && pc && pc.remoteDescription) {
        try { await pc.addIceCandidate(msg.candidate); } catch(e){}
      }
    } else if (role === 'sing') {
      if (msg.type === 'answer' && pc) {
        if (!pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        }
      } else if (msg.type === 'candidate' && pc && pc.remoteDescription) {
        try { await pc.addIceCandidate(msg.candidate); } catch(e){}
      }
    }
  };
}

function setRole(r) {
  role = r;
  connectSignaling();
  document.getElementById('picker').classList.remove('active');
  document.getElementById(r === 'sing' ? 'sender' : 'receiver').classList.add('active');
}

function forceAudioContext() {
  if (!globalAudioCtx) {
    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (globalAudioCtx.state === 'suspended') {
    globalAudioCtx.resume();
  }
  document.querySelectorAll('audio').forEach(audio => audio.play().catch(e => {}));
  document.getElementById('statusLog').style.color = "#30d158";
  document.getElementById('statusLog').textContent = "Audio Unlocked! State: " + globalAudioCtx.state;
}

function playPhoneTestTone() {
  try {
    if (!phoneAudioCtx) {
      phoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (phoneAudioCtx.state === 'suspended') {
      phoneAudioCtx.resume();
    }
    const osc = phoneAudioCtx.createOscillator();
    const gain = phoneAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, phoneAudioCtx.currentTime);
    gain.gain.setValueAtTime(0.5, phoneAudioCtx.currentTime);
    osc.connect(gain);
    gain.connect(phoneAudioCtx.destination);
    osc.start();
    osc.stop(phoneAudioCtx.currentTime + 1.0);
  } catch(e) {
    alert("Test tone error: " + e.message);
  }
}

async function toggleMic() {
  const btn = document.getElementById('micBtn');
  const testBtn = document.getElementById('testBtn');
  
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      pc = new RTCPeerConnection(rtcConfig);
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      
      pc.onicecandidate = e => {
        if (e.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
        }
      };
      
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      
      ws.send(JSON.stringify({ type: 'offer', sdp: offer, name: document.getElementById('name').value || 'Singer' }));

      btn.textContent = 'Stop Singing';
      btn.style.background = '#30d158';
      testBtn.style.display = 'block';
      document.getElementById('meter').textContent = 'Mic Status: Live & Streaming';
    } catch(e) { alert('Mic error: ' + e.message); }
  } else {
    stream.getTracks().forEach(t => t.stop());
    if (pc) pc.close();
    location.reload();
  }
}

async function handleOffer(msg) {
  if (pc) return; // Handle 1 active stream connection
  pc = new RTCPeerConnection(rtcConfig);
  
  const audio = document.createElement('audio');
  audio.autoplay = true;
  audio.controls = true;
  audio.playsInline = true;
  document.getElementById('audio-container').appendChild(audio);
  document.getElementById('list').textContent = `1 singer(s) active (${msg.name}):`;

  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    const logEl = document.getElementById('statusLog');
    logEl.textContent = "Connection State: " + state;
    if (state === 'connected') {
      logEl.style.color = "#30d158";
    } else if (state === 'failed' || state === 'disconnected') {
      logEl.style.color = "#ff453a";
    }
  };

  pc.onicecandidate = e => {
    if (e.candidate) {
      ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
    }
  };
  
  pc.ontrack = e => {
    audio.srcObject = e.streams[0];
    audio.play().catch(err => console.log("Autoplay blocked, click audio button"));
    
    if (!globalAudioCtx) {
      globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    try {
      const sourceNode = globalAudioCtx.createMediaStreamSource(e.streams[0]);
      sourceNode.connect(globalAudioCtx.destination);
    } catch(err) {}
  };

  await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  ws.send(JSON.stringify({ type: 'answer', sdp: answer }));
}
</script>
</body>
</html>
