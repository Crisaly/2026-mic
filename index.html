<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Mic</title>
<style>
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
  .view { display: none; flex-direction: column; gap: 20px; width: 300px; }
  .active { display: flex; }
  button { padding: 18px; font-size: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
  .sing { background: #ff453a; }
  .listen { background: #0a84ff; }
  .test { background: #5856d6; }
  .unmute { background: #30d158; }
  input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #1c1c1e; color: #fff; text-align: center; }
  .panel { background: #1c1c1e; padding: 15px; border-radius: 12px; text-align: left; margin-top: 10px; }
  #meter { font-weight: bold; color: #30d158; min-height: 24px; }
</style>
</head>
<body>

<div id="picker" class="view active">
  <h1>🎤 Karaoke Mic</h1>
  <button class="sing" onclick="setRole('sing')">I'm Singing</button>
  <button class="listen" onclick="setRole('listen')">I'm the Speaker</button>
</div>

<div id="sender" class="view">
  <h2>Wireless Mic</h2>
  <input type="text" id="name" placeholder="Your Name">
  <button class="sing" id="micBtn" onclick="toggleMic()">Start Singing</button>
  <button class="test" id="testBtn" onclick="streamTestTone()" style="display:none;">🔊 Play Sound on MacBook</button>
  <div id="meter">Mic Status: Ready</div>
  <button onclick="location.reload()" style="background:#444">Back</button>
</div>

<div id="receiver" class="view" style="width: 400px;">
  <h2>Speaker Hub</h2>
  <button class="unmute" onclick="forcePlayAudio()">🔊 1. Click Here to Enable Audio</button>
  <button class="test" onclick="playLocalTone(440)">🔊 Speaker Test Tone</button>
  <div class="panel">
    <h3>Connected Singers</h3>
    <div id="list">None</div>
  </div>
  <button onclick="location.reload()" style="background:#444">Back</button>
</div>

<script>
let role = '', pc, stream, peerId = '', activePeers = new Map();

function setRole(r) {
  role = r;
  document.getElementById('picker').classList.remove('active');
  document.getElementById(r === 'sing' ? 'sender' : 'receiver').classList.add('active');
  if(r === 'listen') startListen();
}

function playLocalTone(freq) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
}

function forcePlayAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  
  let count = 0;
  activePeers.forEach((audio, id) => {
    audio.muted = false;
    audio.volume = 1.0;
    audio.play().then(() => { count++; }).catch(err => console.log(err));
  });
  alert("Audio unlocked! Active streams playing: " + count);
}

function streamTestTone() {
  if (!stream) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const dst = ctx.createMediaStreamDestination();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    osc.connect(gain);
    gain.connect(dst);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);

    const audioTrack = dst.stream.getAudioTracks()[0];
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
    if (sender) {
      sender.replaceTrack(audioTrack);
      setTimeout(() => {
        const originalTrack = stream.getAudioTracks()[0];
        if (originalTrack) sender.replaceTrack(originalTrack);
      }, 900);
    }
  } catch(e) {}
}

async function toggleMic() {
  const btn = document.getElementById('micBtn');
  const testBtn = document.getElementById('testBtn');
  const meter = document.getElementById('meter');
  
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      
      pc.onicecandidate = e => e.candidate && fetch('/signal/candidate', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ peerId, from: 'sender', candidate: e.candidate }) });
      
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      
      const res = await fetch('/signal/offer', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sdp: offer, name: document.getElementById('name').value || 'Singer' }) });
      peerId = (await res.json()).peerId;

      setInterval(async () => {
        const r = await fetch('/signal/answer/' + peerId);
        const d = await r.json();
        if (d.sdp && pc.remoteDescription.type === '') await pc.setRemoteDescription(d.sdp);
      }, 700);

      setInterval(async () => {
        const r = await fetch('/signal/candidates/' + peerId + '?from=receiver');
        const d = await r.json();
        for (const c of d.candidates) await pc.addIceCandidate(c);
      }, 700);

      btn.textContent = 'Stop Singing';
      btn.style.background = '#30d158';
      testBtn.style.display = 'block';
    } catch(e) { alert('Mic error: ' + e.message); }
  } else {
    stream.getTracks().forEach(t => t.stop());
    if (pc) pc.close();
    fetch('/signal/leave', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ peerId }) });
    location.reload();
  }
}

async function startListen() {
  setInterval(async () => {
    try {
      const res = await fetch('/signal/offers');
      const data = await res.json();
      for (const o of data.offers) handleOffer(o);
    } catch(e) {}
  }, 1000);
}

async function handleOffer(o) {
  if (activePeers.has(o.peerId)) return;
  const pcR = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  
  // Immediately register peer so it shows up in activePeers
  const audio = document.createElement('audio');
  audio.autoplay = true;
  audio.playsInline = true;
  audio.controls = false;
  audio.muted = false;
  document.body.appendChild(audio);
  activePeers.set(o.peerId, audio);
  updateList();

  pcR.onicecandidate = e => e.candidate && fetch('/signal/candidate', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ peerId: o.peerId, from: 'receiver', candidate: e.candidate }) });
  
  pcR.ontrack = e => {
    audio.srcObject = e.streams[0];
    audio.play().catch(err => console.log(err));
  };

  await pcR.setRemoteDescription(o.sdp);
  const answer = await pcR.createAnswer();
  await pcR.setLocalDescription(answer);

  await fetch('/signal/answer', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ peerId: o.peerId, sdp: answer }) });

  setInterval(async () => {
    try {
      const res = await fetch('/signal/candidates/' + o.peerId + '?from=sender');
      const d = await res.json();
      for (const c of d.candidates) await pcR.addIceCandidate(c);
    } catch(e) {}
  }, 700);
}

function updateList() {
  const list = document.getElementById('list');
  list.innerHTML = activePeers.size === 0 ? 'None' : `${activePeers.size} singer(s) connected`;
}
</script>
</body>
</html>
